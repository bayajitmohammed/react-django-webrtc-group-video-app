services:
  backend:
    build:
      context: ./backend
      target: prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: prod
    env_file:
      - .env
    command: python manage.py migrate
    profiles:
      - tools
