services:
  frontend:
    image: react-django-webrtc-group-video-app-frontend:prod
    container_name: video-app-frontend-prod
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "80:80"
    restart: unless-stopped

  backend:
    image: react-django-webrtc-group-video-app-backend:prod
    container_name: video-app-backend-prod
    build:
      context: ./backend
      target: prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  migrate:
    image: react-django-webrtc-group-video-app-backend:prod
    container_name: video-app-migrate-prod
    build:
      context: ./backend
      target: prod
    env_file:
      - .env
    command: python manage.py migrate
    profiles:
      - tools
