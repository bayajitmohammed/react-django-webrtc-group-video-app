services:
  frontend:
    image: react-django-webrtc-group-video-app-frontend:prod
    container_name: video-app-frontend-prod
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "80:80"
    restart: unless-stopped

  backend:
    image: react-django-webrtc-group-video-app-backend:prod
    container_name: video-app-backend-prod
    build:
      context: ./backend
      target: prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  migrate:
    image: react-django-webrtc-group-video-app-backend:prod
    container_name: video-app-migrate-prod
    build:
      context: ./backend
      target: prod
    env_file:
      - .env
    command: python manage.py migrate
    profiles:
      - tools

  redis:
    image: redis:7-alpine
    container_name: video-app-redis-prod
    volumes:
      - redis_data:/data
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6
    container_name: video-app-coturn-prod
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--realm=${TURN_REALM}"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET}"
      - "--no-cli"
    restart: unless-stopped

volumes:
  redis_data:
