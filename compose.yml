services:
  frontend:
    image: video-app-frontend:dev
    container_name: video-app-frontend
    build:
      context: ./frontend
      target: dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env

  backend:
    image: video-app-backend:dev
    container_name: video-app-backend
    build:
      context: ./backend
      target: dev
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env

  migrate:
    image: video-app-backend:dev
    container_name: video-app-migrate
    build:
      context: ./backend
      target: dev
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - .env
    command: python manage.py migrate
    profiles:
      - tools

  coturn:
    image: coturn/coturn:4.6
    container_name: video-app-coturn
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--realm=${TURN_REALM}"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET}"
      - "--no-cli"
